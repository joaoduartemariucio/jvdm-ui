name: Dependabot

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-merge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge the tested commit and release it
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const { data: pulls } = await github.rest.pulls.list({
              ...context.repo,
              state: 'open',
              head: `${context.repo.owner}:${run.head_branch}`,
            });
            const pullRequest = pulls.find((pull) => pull.head.sha === run.head_sha);

            if (!pullRequest) {
              core.info(`No open pull request has ${run.head_sha} as its head. Nothing to merge.`);
              return;
            }

            if (pullRequest.user.login !== 'dependabot[bot]' || pullRequest.draft || pullRequest.base.ref !== 'main') {
              core.info(`#${pullRequest.number} is not a ready Dependabot pull request into main.`);
              return;
            }

            try {
              await github.rest.pulls.merge({
                ...context.repo,
                pull_number: pullRequest.number,
                merge_method: 'squash',
                sha: run.head_sha,
              });
            } catch (error) {
              if (error.status === 405 || error.status === 409) {
                core.warning(`#${pullRequest.number} was not merged: ${error.message}. Dependabot will rebase it and CI will run again.`);
                return;
              }
              throw error;
            }

            core.info(`Merged #${pullRequest.number}.`);

            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'release.yml',
              ref: 'main',
              inputs: { pr: String(pullRequest.number) },
            });
            core.info(`Release dispatched for #${pullRequest.number}.`);
