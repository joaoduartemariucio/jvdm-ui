name: PR

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - id: next
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/next-version.mjs >> "$GITHUB_OUTPUT"

      - name: Write summary
        env:
          CURRENT: ${{ steps.next.outputs.current }}
          LEVEL: ${{ steps.next.outputs.level }}
          SOURCE: ${{ steps.next.outputs.source }}
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          if [ "$LEVEL" = "none" ]; then
            echo "### No release" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "This PR is labelled \`no-release\`. Merging it will not publish anything." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Merging this PR releases \`v$NEXT\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| | |" >> "$GITHUB_STEP_SUMMARY"
            echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
            echo "| current | \`$CURRENT\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| bump | \`$LEVEL\` (from $SOURCE) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| next | \`$NEXT\` |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on the PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          LEVEL: ${{ steps.next.outputs.level }}
          SOURCE: ${{ steps.next.outputs.source }}
          NEXT: ${{ steps.next.outputs.next }}
          CURRENT: ${{ steps.next.outputs.current }}
        with:
          script: |
            const marker = '<!-- jvdm-ui-version-preview -->';
            const { LEVEL, SOURCE, NEXT, CURRENT } = process.env;

            const body = LEVEL === 'none'
              ? `${marker}\n**No release.** This PR is labelled \`no-release\`, so merging it publishes nothing.`
              : [
                  marker,
                  `**Merging this PR releases \`v${NEXT}\`** — a \`${LEVEL}\` bump from \`${CURRENT}\`, decided by the ${SOURCE}.`,
                  '',
                  'Change it with a `major` / `minor` / `patch` label, or `no-release` to publish nothing.',
                ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
