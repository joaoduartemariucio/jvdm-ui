name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      level: ${{ steps.next.outputs.level }}
      next: ${{ steps.next.outputs.next }}
      current: ${{ steps.next.outputs.current }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - id: next
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/next-version.mjs >> "$GITHUB_OUTPUT"

      - env:
          LEVEL: ${{ steps.next.outputs.level }}
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          if [ "$LEVEL" = "none" ]; then
            echo "Labelled \`no-release\`. Nothing is published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Releasing \`v$NEXT\` (\`$LEVEL\` bump)." >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    needs: plan
    if: needs.plan.outputs.level != 'none'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck:site
      - run: npm run build
      - run: npm run site:build

      - name: Bump, commit and tag
        env:
          NEXT: ${{ needs.plan.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$NEXT" --message "chore: release v%s [skip ci]"
          git push --follow-tags origin main

      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@^11

      - name: Authenticate to npm when a token is configured
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
            echo "Publishing with NPM_TOKEN."
          else
            echo "No NPM_TOKEN set — relying on npm trusted publishing (OIDC)."
          fi

      - run: npm publish --access public

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ needs.plan.outputs.next }}
        run: gh release create "v$NEXT" --generate-notes --title "v$NEXT"
